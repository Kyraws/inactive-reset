<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Checkpoint selector checks</title>
<pre id="report">Running...</pre>
<script>
// Dependency-free checks of the production page script with a small DOM stub.
// This checks selection behaviour, not browser rendering or layout.
function runCheckpointTests(script, html) {
  if (html) {
    const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);
    if (ids.length!==new Set(ids).size) throw new Error('duplicate element ID in production HTML');
    const declared=new Set(ids);
    for (const match of script.matchAll(/getElementById\('([^']+)'\)/g))
      if (!declared.has(match[1])) throw new Error('missing production element: '+match[1]);
    if (html.includes('id="tyres"') || html.includes('tyre-wheel')) throw new Error('unrequested live tyre viewer');
    if (!html.includes('href="/app.css"') || !html.includes('class="lab-frame"') || !html.includes('id="practicePanel"')) throw new Error('shared application shell missing');
  }
  const elements = new Map();
  function element(id) {
    if (!elements.has(id)) elements.set(id, {
      dataset:{}, value:'', textContent:'', disabled:false, options:[], writes:0, scrollTop:0, scrollHeight:100, clientHeight:100,
      addEventListener(){}, querySelector(){return null;},
      set innerHTML(html) {
        this.html=html; this.writes++;
        if(id==='cp') {
          this.options=[...html.matchAll(/<option value="([^"]*)"/g)].map(m=>m[1]);
          this.value=this.options[0] || '';
        }
      },
      get innerHTML(){return this.html || '';}
    });
    return elements.get(id);
  }
  let response={},captureResponse={},pendingResponse=null,getRequests=0,pollRefresh=null;
  const storedPreferences={};
  const storage={getItem:k=>storedPreferences[k] || null,setItem:(k,v)=>storedPreferences[k]=v};
  const ui = new Function('document','fetch','setInterval','clearInterval','alert','sessionStorage',
    'let navigation=null;\n'+script + '\nreturn {canRestoreSpeed,renderCheckpoints,renderActivity,updateDestination,place,resetFromHotkey,capture,quickCapture,cycleCheckpoint,speedReadyCheckpoints,runPracticeInput,cancelPlacement,tyreOptions,resetTyres,updateTyreSettings,refresh,setNavigation(value){navigation=value;}};')(
      {getElementById:element},
      async (path,options) => {
        if(options?.method==='POST') {posted=JSON.parse(options.body);postedPath=path;}
        else if(path==='/api/state') { getRequests++; if(pendingResponse) await pendingResponse; }
        return {json:async()=>options?.method==='POST' && JSON.parse(options.body).quick ? captureResponse : response};
      }, callback => { pollRefresh=callback; return 1; }, () => {}, () => {}, storage);
  let posted, postedPath;
  const state={session:{track:'Daytona',vehicle:'McLaren'},checkpoints:[
    {id:'Barcelona/Ferrari/End of Lap.json',name:'End of Lap',track:'Barcelona',vehicle:'Ferrari',lapDistance:4500},
    {id:'Daytona/McLaren/eND OF LAP.json',name:'eND OF LAP',track:'DAYTONA',vehicle:'McLaren',lapDistance:5500,speedKmh:0},
    {id:'Daytona/Genesis/eND OF LAP.json',name:'eND OF LAP',track:'Daytona',vehicle:'Genesis',lapDistance:5400,speedKmh:144.5}
  ],calibrations:[{track:'Barcelona',vehicle:'Ferrari',advisory:'OLD HISTORY'}]};
  let checks=0;
  function check(condition,message) {if(!condition) throw new Error(message);checks++;}
  const select=element('cp');
  ui.renderCheckpoints(state);
  check(select.options.length===2 && !select.innerHTML.includes('Barcelona/'), 'filter to loaded track, all cars');
  check(element('destinationSpeed').textContent.includes('0.0 km/h'), 'stationary capture has known zero speed');
  check(new Set(select.options).size===2, 'same names have distinct IDs');
  check(!select.innerHTML.includes('captured in') && !select.innerHTML.includes(' m '), 'destination rows show names only');
  select.value=state.checkpoints[2].id;
  const writes=select.writes;
  ui.renderCheckpoints(state);
  check(select.value===state.checkpoints[2].id && select.writes===writes, 'poll preserves selection without rebuilding');
  check(element('destinationSpeed').textContent.includes('144.5 km/h') && element('restoreSpeedHint').textContent.includes('Standing teleport'), 'ineligible motion data clearly offers standing teleport');
  state.busy=true; ui.renderCheckpoints(state);
  check(select.disabled, 'disable selection while busy');
  state.busy=false; state.session={track:'Barcelona',vehicle:'Ferrari'};
  ui.renderCheckpoints(state);
  check(select.options.length===1 && select.value===state.checkpoints[0].id, 'track change clears old selection');
  check(element('destinationSpeed').textContent.includes('unavailable'), 'legacy speed is unknown rather than zero');
  state.session=null; ui.renderCheckpoints(state);
  check(!select.value && select.disabled, 'menus show no usable captures');
  check(element('destinationSpeed').textContent==='', 'menus clear captured speed');
  state.session={track:'Daytona',vehicle:'McLaren'}; ui.renderCheckpoints(state);
  select.value=state.checkpoints[2].id;
  for(const wheel of ['FL','FR','RL','RR']) {element('tyreCondition'+wheel).value='100';element('tyreTemperature'+wheel).value='70';}
  check(ui.tyreOptions().wheels.every(w=>w.temperatureCelsius===null), 'default temperature stays game controlled');
  element('tyreTemperatureEnabledFL').checked=true;
  check(ui.tyreOptions().wheels[0].temperatureCelsius===70 && ui.tyreOptions().wheels[1].temperatureCelsius===null, 'temperature option uses Celsius');
  element('tyreConditionFL').value='101';
  let rejected=false; try {ui.tyreOptions();} catch {rejected=true;}
  check(rejected,'reject out-of-range condition before posting');
  element('tyreConditionFL').value='100';
  element('freshOnPlace').checked=true;
  return ui.place(true).then(()=>{
    check(posted.checkpoint===state.checkpoints[2].id, 'place posts exact cross-car capture ID');
    check(posted.tyres.wheels[0].conditionPercent===100 && posted.tyres.wheels[0].temperatureCelsius===70 && posted.tyres.wheels[1].temperatureCelsius===null,'placement carries requested tyre settings');
    return ui.resetTyres();
  }).then(()=>{
    check(postedPath==='/api/tyres' && posted.tyres.wheels[0].conditionPercent===100,'standalone reset posts four-wheel settings');
    return ui.cancelPlacement();
  }).then(()=>{
    check(postedPath==='/api/cancel', 'cancel posts the cleanup request');
    response={...state,connected:true,inGarage:true,busy:false,phase:'Idle',
      session:{track:'Daytona',vehicle:'McLaren',lapDistance:5500,gear:0,x:0,y:0,z:0,yaw:0,capturable:true},
      tyreRules:{inGarage:true}};
    return ui.refresh();
  }).then(()=>{
    check(!element('standingBtn').disabled && !element('tyreResetBtn').disabled,'garage permits standing placement and preparation');
    check(element('session').innerHTML.includes('In garage'),'show garage state prominently');
    element('freshOnPlace').checked=true; ui.updateTyreSettings();
    check(element('tyreSummary').textContent.includes('70\u00b0C') && !element('tyreSummary').textContent.includes('\\u00'),'tyre summary shows actual initial temperature');
    response={...response,busy:true,phase:'Armed',phaseMessage:'TYRES PREPARED - press Drive'};
    return ui.refresh();
  }).then(()=>{
    check(element('tyreSetup').disabled && element('placeBtn').disabled && element('freshOnPlace').disabled,'lock changing preparation settings while busy');
    check(!element('cancelBtn').disabled && element('phase').textContent==='PRESS DRIVE','make Drive cue and cancel available while armed');
    response={...response,busy:false,phase:'Idle',phaseMessage:'',inGarage:false,tyreRules:{inGarage:false}};
    return ui.refresh();
  }).then(()=>{
    check(element('placeBtn').disabled && element('tyreResetBtn').disabled && !element('capBtn').disabled,'on track permits capture but blocks preparation');
    check(element('placeHint').textContent.includes('Return to the garage'),'explain why placement is disabled');
    response={...response,inGarage:true,tyreRules:null,tyreRulesError:'Unsupported tyre code'};
    return ui.refresh();
  }).then(()=>{
    check(element('tyreResetBtn').disabled && !element('standingBtn').disabled && !element('freshOnPlace').checked,'unsupported tyre discovery does not block standing placement');
    check(element('log').textContent.includes('Tyre discovery: Unsupported tyre code'),'explain unavailable tyre reset in Activity');
    element('tyreConditionFL').value=''; let rejected=false; try{ui.tyreOptions();}catch{rejected=true;}
    check(rejected,'empty condition is not silently interpreted as zero');
    const loggedState={...response,checkpointErrors:['Skipped checkpoint broken.json'],log:['Keep the pit limiter on until CLEAR.'],outcome:{lines:[{label:'Arrival',value:'Verified',sentence:'Horizontal error 0.001 m.'}]}};
    element('log').scrollTop=7; element('log').scrollHeight=500; element('log').clientHeight=100;
    ui.renderActivity(loggedState);
    check(element('log').scrollTop===7,'poll preserves earlier Activity scroll position');
    check(element('log').textContent.includes('Arrival: Verified') && element('log').textContent.includes('Horizontal error 0.001 m.'),'server result details remain in Activity');
    check(element('log').textContent.includes('Keep the pit limiter on until CLEAR.'),'backend cleanup guidance retained');
    check(element('log').textContent.includes('Skipped checkpoint broken.json'),'invalid checkpoint is reported while valid state remains available');
    const diagnosticText=element('log').textContent; ui.renderActivity(loggedState);
    check(element('log').textContent===diagnosticText,'unchanged diagnostics do not duplicate on each poll');
    select.scrollTop=120; ui.renderCheckpoints(response);
    check(select.scrollTop===120,'poll preserves destination scroll position');
    response={...response,game:{running:false,canLaunchDirect:true,canLaunchProtected:true}};
    return ui.refresh();
  }).then(()=>{
    check(!element('launchDirect').disabled && !element('launchEac').disabled,'both launch buttons enabled when the game is closed');
    response={...response,game:{running:true,canLaunchDirect:true,canLaunchProtected:true}};
    return ui.refresh();
  }).then(()=>{
    check(element('launchDirect').disabled && element('launchEac').disabled,'both launches blocked while game runs');
    element('tyreConditionFL').value='100';element('tyreConditionFR').value='85';element('tyreConditionRL').value='40';element('tyreConditionRR').value='15';
    element('tyreTemperatureEnabledRL').checked=true;element('tyreTemperatureRL').value='55';
    ui.updateTyreSettings();
    const saved=JSON.parse(storedPreferences['practice-preferences']);
    check(saved.wheels.FR.condition==='85' && saved.wheels.RL.heat==='55' && saved.wheels.RL.enabled,'tyre choices saved across workspace navigation');
    ui.updateDestination();
    check(JSON.parse(storedPreferences['practice-preferences']).checkpoint===element('cp').value,'selected checkpoint saved across workspace navigation');
    const individual=ui.tyreOptions().wheels;
    check(individual.map(w=>w.conditionPercent).join(',')==='100,85,40,15','condition values stay in FL FR RL RR order');
    check(individual.map(w=>w.temperatureCelsius).join(',')==='70,,55,','each wheel has an independent heat option');
    element('freshOnPlace').checked=true;
    return ui.place();
  }).then(()=>{
    check(postedPath==='/api/place' && posted.tyres.wheels[1].conditionPercent===85 && posted.tyres.wheels[2].temperatureCelsius===55 && posted.tyres.wheels[3].temperatureCelsius===null,'placement request preserves independent values');
    return ui.resetTyres();
  }).then(()=>{
    check(posted.tyres.wheels[1].conditionPercent===85 && posted.tyres.wheels[2].temperatureCelsius===55 && posted.tyres.wheels[3].temperatureCelsius===null,'standalone request preserves independent values');
    element('tyreTemperatureEnabledRR').checked=true;element('tyreTemperatureRR').value='';
    let rejected=false;try{ui.tyreOptions();}catch{rejected=true;}
    check(rejected,'enabled wheel heat cannot be blank');
    const rolling={...state,rollingStartSupported:true,busy:false,checkpoints:[{id:'speed.json',name:'Speed test',track:'Daytona',vehicle:'McLaren',speedKmh:8.94,rollingEligible:true}]};
    response=rolling;
    return ui.refresh().then(()=>{
    ui.renderCheckpoints(rolling);
    check(ui.canRestoreSpeed(),'eligible captures restore speed and gear automatically');
    ui.updateDestination();
    check(element('restoreSpeedHint').textContent.includes('restore automatically'),'summary explains automatic speed and gear restoration');
    element('freshOnPlace').checked=false;
    return ui.place().then(()=>{
      check(posted.restoreSpeed===true,'default placement restores speed and gear');
      ui.renderCheckpoints({...rolling,busy:true});
      check(ui.canRestoreSpeed(),'busy state does not change automatic motion eligibility');
      ui.renderCheckpoints({...rolling,session:{track:'Daytona',vehicle:'Genesis'}});
      check(!ui.canRestoreSpeed(),'cross-car selection requires standing teleport');
      check(element('restoreSpeedHint').textContent.includes('McLaren') && element('restoreSpeedHint').textContent.includes('Genesis') && element('restoreSpeedHint').textContent.includes('capture car'),'cross-car explanation identifies both cars and the restriction');
      ui.renderCheckpoints({...rolling,rollingStartSupported:false});
      check(!ui.canRestoreSpeed(),'unsupported build blocks rolling start');
      ui.renderCheckpoints({...rolling,checkpoints:[{...rolling.checkpoints[0],speedKmh:null,rollingEligible:false}]});
      check(!ui.canRestoreSpeed(),'captures without motion data require standing teleport');
      const onTrack={...rolling,connected:true,inGarage:false};
      response=onTrack;
      return ui.refresh().then(async()=>{
        check(!element('placeBtn').disabled && element('placeBtn').textContent.includes('Reset on track'),'on-track direct reset is available on the researched build');
        check(element('placeHint').textContent.includes('Ctrl+Alt+R'),'cockpit hotkey is explained');
        ui.updateDestination();element('freshOnPlace').checked=true;
        posted=null;
        await ui.place();
        check(posted===null && element('noticeText').textContent.includes('garage Drive handoff'),'on-track teleport refuses to silently ignore requested tyre conditioning');
        element('freshOnPlace').checked=false;
        await ui.place();
        check(posted.directReset===true && posted.restoreSpeed===true && posted.tyres===undefined,'direct reset preserves the motion choice without requesting garage tyre preparation');
        posted=null;ui.renderCheckpoints({...onTrack,busy:true});await ui.resetFromHotkey();
        check(posted===null,'hotkey ignores an operation already running');
        element('freshOnPlace').checked=false;
        ui.renderCheckpoints({...onTrack,inGarage:true});await ui.resetFromHotkey();
        check(posted.directReset===false,'garage hotkey uses the original Drive handoff');
        posted=null;
        ui.renderCheckpoints({...onTrack,rollingStartSupported:false});await ui.resetFromHotkey();
        check(posted===null,'hotkey refuses unsupported builds');
        ui.renderCheckpoints(onTrack);await ui.resetFromHotkey();
        check(posted.directReset===true,'cockpit hotkey dispatches the selected checkpoint through the direct path');
        await ui.resetFromHotkey(true);
        check(posted.directReset===true && posted.restoreSpeed===false,'standing hotkey explicitly bypasses motion restoration');
        await ui.place(true);
        check(posted.restoreSpeed===false,'standing button bypasses motion restoration');
        response={...onTrack,busy:true,phase:'WaitingToClear'};await ui.refresh();
        check(!element('placeBtn').disabled,'inherited pit cleanup does not block another direct reset');
        posted=null;await ui.resetFromHotkey();
        check(posted.directReset===true && posted.restoreSpeed===true,'reset during pit cleanup preserves the selected motion choice');
        posted=null;await ui.quickCapture();
        check(posted===null,'quick capture ignores an operation in progress');
        ui.renderCheckpoints({...onTrack,session:{...onTrack.session,capturable:true},checkpoints:[]});
        check(element('cp').disabled && !element('cp').value,'empty library has no teleport destination');
        const quick={id:'Daytona/McLaren/Quick capture.json',name:'Quick capture',track:'Daytona',vehicle:'McLaren',rollingEligible:true,speedKmh:126};
        captureResponse={ok:true,id:quick.id};
        response={...onTrack,session:{...onTrack.session,capturable:true},checkpoints:[quick]};
        await ui.runPracticeInput('capture');
        check(postedPath==='/api/capture' && posted.quick===true,'quick capture uses the reserved reusable slot');
        check(element('cp').value===quick.id && ui.canRestoreSpeed(),'quick capture selects the saved checkpoint for motion teleport');
        check(!element('cp').disabled,'first quick capture enables the destination selector');
        await ui.resetFromHotkey();
        check(posted.checkpoint===quick.id && posted.restoreSpeed===true,'teleport hotkey returns to the quick capture with speed and gear');
        captureResponse={error:'Capture refused'};
        await ui.quickCapture();
        check(element('cp').value===quick.id && element('noticeText').textContent==='Capture refused','failed quick capture preserves the selected checkpoint and explains failure');
        const candidates={...response,checkpoints:[
          {...quick,id:'late',name:'Late',lapDistance:400,gear:3},
          {...quick,id:'early',name:'Early',lapDistance:100,gear:2},
          {...quick,id:'quick',name:'Quick capture',lapDistance:250,gear:2},
          {...quick,id:'wrong-car',vehicle:'Genesis',lapDistance:150,gear:2},
          {...quick,id:'standing',speedKmh:0,rollingEligible:false,gear:0},
          {...quick,id:'wrong-track',track:'Barcelona',gear:2},
          {...quick,id:'no-gear',gear:0}
        ]};
        response=candidates;await ui.refresh();
        check(ui.speedReadyCheckpoints().map(c=>c.id).join(',')==='early,quick,late','cycling includes only current-track/car motion-ready captures in lap order');
        posted=null;element('cp').value='wrong-car';await ui.runPracticeInput('next');
        check(element('cp').value==='early' && posted===null,'next selects the first eligible destination without teleporting');
        await ui.runPracticeInput('previous');
        check(element('cp').value==='late','previous wraps around the eligible list');
        await ui.runPracticeInput('next');await ui.runPracticeInput('next');
        check(element('cp').value==='quick','quick capture participates in cycling');
        await ui.runPracticeInput('teleport');
        check(posted.checkpoint==='quick' && posted.restoreSpeed===true,'teleport uses the cycled selection');
        const eac={...candidates,connected:false,rollingStartSupported:false,game:{running:true,protected:true}};
        response=eac;await ui.refresh();
        check(!element('capBtn').disabled && element('placeBtn').disabled && element('standingBtn').disabled && element('tyreResetBtn').disabled,'EAC enables telemetry capture while disabling teleport and tyre preparation');
        check(element('placeHint').textContent.includes('EAC on') && element('tyreResetHint').textContent.includes('Launch local play'),'Disabled EAC actions explain the reason and next step');
        check(ui.speedReadyCheckpoints().length===3,'EAC can browse speed-ready captures without internal build discovery');
        posted=null;await ui.runPracticeInput('next');check(posted===null,'EAC checkpoint cycling changes selection without game writes');
        posted=null;await ui.resetFromHotkey();await ui.place(true);await ui.resetTyres();
        check(posted===null && element('noticeText').textContent.includes('EAC on'),'EAC shortcuts explain blocked actions without submitting writes');
        captureResponse={ok:true,id:quick.id};response={...eac,checkpoints:[...eac.checkpoints,quick]};
        await ui.quickCapture();
        check(postedPath==='/api/capture' && posted.quick===true && element('cp').value===quick.id,'EAC quick capture uses telemetry without a memory connection');
        check(element('noticeText').textContent.includes('restart LMU'),'EAC capture success explains how to teleport later');
        element('capName').value='Named EAC checkpoint';await ui.capture();
        check(posted.name==='Named EAC checkpoint','Named checkpoint capture is available under EAC');
        ui.setNavigation({state:{gameState:'GSTATE_SETUP'}});response=eac;await ui.refresh();
        check(element('capBtn').disabled && element('capHint').textContent.includes('Load a session'),'Main menu cannot capture a leftover SDK position');
        posted=null;await ui.quickCapture();await ui.capture();check(posted===null,'Both capture paths refuse leftover main-menu telemetry');
        response={...candidates,inGarage:true,tyreRules:{inGarage:true}};
        ui.setNavigation({state:{settingMode:'SETTING_GRANDPRIX',gameState:'GSTATE_DYN',gameSession:'RACE1'}});await ui.refresh();
        check(element('placeBtn').disabled && element('tyreResetBtn').disabled && element('placeHint').textContent.includes('single-player Practice'),'EAC-off race sessions still explain that memory tools need Practice');
        posted=null;await ui.resetFromHotkey();await ui.resetTyres();check(posted===null,'Race-session shortcuts do not submit practice-only writes');
        ui.setNavigation(null);
        response=candidates;element('cp').value='quick';await ui.refresh();
        ui.renderCheckpoints({...candidates,busy:true});ui.cycleCheckpoint(1);
        check(element('cp').value==='quick','active placement freezes cycling');
        ui.renderCheckpoints({...candidates,checkpoints:[]});ui.cycleCheckpoint(1);
        check(element('noticeText').textContent.includes('No speed-ready checkpoints'),'empty eligible list explains how to create a destination');
        await ui.refresh();
        let release;
        pendingResponse=new Promise(resolve=>release=resolve);
        response={...response,phase:'Armed',busy:true};
        const previousRequests=getRequests;
        const slow=ui.refresh(),overlapping=pollRefresh();pollRefresh();
        check(getRequests===previousRequests+1,'slow polling keeps only one state request in flight');
        release();await Promise.all([slow,overlapping]);pendingResponse=null;
        check(element('phase').textContent==='PRESS DRIVE','slow state response still updates visible progress');
        return checks;
      });
    });
    });
  });
}
// Browser entry point. Serve the repository root, then open this file over HTTP.
Promise.all(['Practice.js','Lab.html'].map(n=>fetch('../src/InactiveReset.Ui/'+n).then(r=>r.text()))).then(([script,html])=>
  runCheckpointTests(script,html)
).then(count=>document.getElementById('report').textContent=count+' checks passed',
  error=>document.getElementById('report').textContent='FAILED: '+error.message);
</script>
</html>
