 check(managed.at(-1).action==='clearQuick'&&managed.at(-1).ids.length===41&&checkpoints.some(point=>point.id==='elsewhere'),'Second clear keeps captures outside the selected scope');

 d.getElementById('practiceTyresView').click();
 check(d.getElementById('practiceTyres').open,'Tyre editor opens');
 d.getElementById('practiceTyres').close();
 check(errors.length===0,'No unhandled errors: '+errors.join('; '));
 ui.setPage('setup','selection');
 check(d.getElementById('editor').scrollWidth<=d.getElementById('editor').clientWidth,'Narrow builder stacks without horizontal overflow');
 frame.style.width='1040px';
 await until(()=>w.innerWidth===1040,'Desktop minimum viewport');
 d.querySelector('[data-builder-open=sessions]').click();
 const timing=d.getElementById('builderDetail'), stableHeight=timing.getBoundingClientRect().height;
 timing.querySelector('[data-amount=WARMUP]').click();
 timing.querySelector('[data-amount=RACE]').click();
 const timingHeightByStage=[...timing.querySelectorAll('[data-timing-stage]')].map(tab=>tab.dataset.timingStage).map(stage=>{
   timing.querySelector(`[data-timing-stage="${stage}"]`).click();
   return timing.querySelector('.timing-options').getBoundingClientRect().height;
 });
 check(timingHeightByStage.length===4&&timingHeightByStage.every(height=>Math.abs(height-timingHeightByStage[0])<.05),'All four timing panels have the same height');
 timing.querySelector('[data-timing-stage=RACE]').click();
 check(timing.getBoundingClientRect().height===stableHeight&&timing.querySelector('#value-SESSSET_race_time')&&
   timing.querySelector('select[aria-label="Race start"]')?.options[1].text==='Fast rolling'&&
   !timing.querySelector('#value-SESSSET_Race_Laps')&&ui.snapshotPlan().settings.SESSSET_Finish_Criteria===2,'Race uses minutes and named starts without changing the dialog height');
 check(timing.querySelector('#value-SESSSET_race_time').value==='20'&&d.getElementById('sessionSummary').textContent.includes('20 min'),'New Race defaults to 20 minutes in the editor and summary');
 const timingBody=d.getElementById('builderDetailBody');
 check(timingBody.scrollWidth<=timingBody.clientWidth,'Timing controls fit without horizontal scrolling');
 const tabs=[...timing.querySelectorAll('[data-timing-stage]')];
 check(tabs.every(tab=>Math.abs(tab.getBoundingClientRect().width-tabs[0].getBoundingClientRect().width)<.1),'All timing tabs are equally wide');
 const closed=new Promise(resolve=>timing.addEventListener('close',resolve,{once:true}));
 timing.close();await closed;
 d.querySelector('[data-builder-open=grid]').click();
 const aggression=()=>timing.querySelector('select[aria-label="AI aggression"]');
 const aggressionWidth=aggression().getBoundingClientRect().width;
 aggression().value='2';aggression().dispatchEvent(new w.Event('change',{bubbles:true}));
 check(aggression().options[2].text==='High'&&aggression().getBoundingClientRect().width===aggressionWidth,'AI aggression uses a stable Low, Medium, High selector');
 const strength=()=>timing.querySelector('input[aria-label="AI strength"]');
 const enterStrength=value=>{strength().value=String(value);strength().dispatchEvent(new w.Event('change',{bubbles:true}));};
 enterStrength(120);
 check(strength().value==='105'&&timing.querySelector('[aria-label="Increase AI strength"]').disabled,'Typed strength clamps at the upper bound');
 enterStrength(60);
 check(strength().value==='75'&&timing.querySelector('[aria-label="Decrease AI strength"]').disabled,'Typed strength clamps at the lower bound');
 timing.querySelector('[aria-label="Increase AI strength"]').click();
 check(strength().value==='76'&&d.getElementById('quickStrength').value==='76'&&timing.querySelector('input[aria-label="AI strength slider"]').value==='76','A single step advances one point and synchronizes both sliders');
 check(w.getComputedStyle(strength()).appearance==='textfield','Numeric inputs hide the duplicate native arrows');
 const gridClosed=new Promise(resolve=>timing.addEventListener('close',resolve,{once:true}));
 timing.close();await gridClosed;
 frame.style.height='395px';
 await new Promise(resolve=>w.requestAnimationFrame(resolve));
 d.querySelector('[data-builder-open=weather]').click();
 const weatherBody=d.getElementById('builderDetailBody');
 weatherBody.scrollTop=85;
 timing.scrollTop=85;
 check((weatherBody.scrollTop>0||timing.scrollTop>0)&&w.getComputedStyle(timing).overflowY==='auto',`Dialog content can scroll at a short viewport (${w.innerHeight}px, dialog ${timing.clientHeight}/${timing.scrollHeight}, body ${weatherBody.clientHeight}/${weatherBody.scrollHeight})`);
 const sky=()=>timing.querySelector('select[aria-label="Sky"]');
 sky().value='4';sky().dispatchEvent(new w.Event('change',{bubbles:true}));
 check(sky().selectedOptions[0].text==='Overcast'&&timing.querySelector('[data-weather-node=START] strong').textContent==='Overcast','Selecting a sky updates the editor and forecast with its name');
 timing.close();
 frame.style.height='680px';
 driving=false;await ui.poll();
 const legacy={id:'legacy-race',name:'Legacy race',target:{settings:{SESSSET_Finish_Criteria:5,SESSSET_race_time:35},amounts:{RACE:1},assists:{},weather:{},classes:['GT3'],fullGrid:false}};
 ui.getPrefs().plans.push(legacy);
 ui.setPage('presets');
 ui.inspectPreset(legacy.id);
 check(d.getElementById('presetDetailsBody').textContent.includes('35% track time'),'Legacy race details retain their percentage');
 d.getElementById('presetDetails').close();
 d.querySelector('[data-plan=legacy-race]').click();
 check(d.getElementById('planChanges').textContent.includes('35% track time'),'Legacy preset review reports the original duration');
 d.getElementById('applyPlanButton').click();
 await until(()=>!d.getElementById('planDialog').open&&d.getElementById('sessionSummary').textContent.includes('35% track time'),'Legacy mode and duration loaded');
 check(setup.settings.SESSSET_Finish_Criteria.currentValue===5&&setup.settings.SESSSET_race_time.currentValue===35,'Loading applies the original legacy mode and duration');
 d.querySelector('[data-builder-open=sessions]').click();
 timing.querySelector('[data-timing-stage=PRACTICE]').click();
 const practice=timing.querySelector('#value-SESSSET_Practice_Length');
 practice.value='55';practice.dispatchEvent(new w.Event('change',{bubbles:true}));
 check(ui.snapshotPlan().settings.SESSSET_Finish_Criteria===5&&ui.snapshotPlan().settings.SESSSET_race_time===35,'Unrelated draft edits preserve legacy duration');
 timing.querySelector('[data-timing-stage=RACE]').click();
 const raceInput=()=>timing.querySelector('#value-SESSSET_race_time');
 check(raceInput().value===''&&raceInput().parentElement.querySelector('.unit').textContent==='min','Editing a legacy race only offers minutes');
 raceInput().value='10';raceInput().dispatchEvent(new w.Event('change',{bubbles:true}));
 timing.querySelector('[data-amount=RACE]').click();
 timing.querySelector('[data-amount=RACE]').click();
 check(ui.snapshotPlan().settings.SESSSET_race_time===10&&d.getElementById('sessionSummary').textContent.includes('10 min'),'Re-enabling Race retains explicitly entered minutes in this draft');
 timing.close();
 d.getElementById('builderApply').click();
 await until(()=>d.getElementById('builderStatus').textContent.includes('Session applied'),'Timed race applied');
 check(writes.some(body=>body.action==='raceMinutes'&&body.value===10)&&setup.settings.SESSSET_Finish_Criteria.currentValue===2&&setup.settings.SESSSET_race_time.currentValue===10,'Entering 10 applies exactly 10 timed minutes');
 w.redlineTestUi=ui;
 document.getElementById('report').textContent='PASS '+count+' Redline checks passed';
}
run().catch(e=>document.getElementById('report').textContent='FAIL '+e.stack);
</script></html>
