<!doctype html><html lang="en"><meta charset="utf-8"><title>Lab checks</title><pre id="report">Running…</pre><iframe id="preview" style="width:1280px;height:800px;border:0"></iframe>
<script>
async function run(){
  const base='../src/InactiveReset.Ui/';

  const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);if(ids.length!==new Set(ids).size)throw Error('Duplicate Lab element ID');
  const frame=document.getElementById('preview'),loaded=new Promise(r=>frame.onload=r);

  const w=frame.contentWindow,d=frame.contentDocument;w.sessionStorage.clear();
  const v=(n,text='')=>({currentValue:n,stringValue:text});
  let prefs={schema:1,theme:'midnight',density:'comfortable',pins:['SESSSET_Num_Opponents'],cars:[],tracks:[],checkpoints:[],plans:[]};
  let data={selection:{selectedCar:{id:'car',isOwned:true,desc:'Team One',fullPathTree:'WEC 2026, GT3, BMW M4'},trackInfo:{id:'track',isOwned:true,trackName:'Daytona',trackLength:'5.7',countryCode:'US',type:'Road Course'},classesSelection:['GT3'],fullGrid:false},amounts:{PRACTICE:1,QUALIFY:0,WARMUP:0,RACE:0},settings:{SESSSET_Practice_Length:v(60),SESSSET_Num_Opponents:v(0),SESSSET_AI_Strength:v(100,'100%'),SESSSET_weather:v(4,'Scripted'),SESSSET_flag_rules:v(2,'Full')},assists:{DRIVEAIDS_auto_wipers:{...v(1,'On'),minValue:0,maxValue:1,stepValue:1}},weather:{PRACTICE:{START:{WNV_TEMPERATURE:v(20,'20°'),WNV_RAIN_CHANCE:v(0,'0%')},FINISH:{WNV_TEMPERATURE:v(25,'25°'),WNV_RAIN_CHANCE:v(0,'0%')}},QUALIFY:{},RACE:{}}};
  const catalog={cars:[data.selection.selectedCar,{id:'car2025',isOwned:true,desc:'Team Old',fullPathTree:'WEC 2025, GT3, BMW M4'},{id:'locked',isOwned:false,desc:'Locked',fullPathTree:'WEC 2026, Hypercar, Ferrari'}],tracks:[{id:'track',owned:true,name:'Daytona Road Course',shortName:'Daytona'},{id:'otherLayout',owned:true,name:'Daytona Short',shortName:'Daytona'}]};
  const checkpoints=[{id:'one',name:'Turn One',track:'Daytona',vehicle:'BMW',lapDistance:400},{id:'other',name:'Other track',track:'Spa',vehicle:'Ferrari',lapDistance:200}];

    if(path==='/api/session/action'){writes.push(b);if(writes.length>failAfter)return {ok:false,json:async()=>({error:'Fixture refused change'})};if(stopAfterNext){stopAfterNext=false;ui.stopPlan();}if(b.action==='setting')data.settings[b.key].currentValue+=b.steps;if(b.action==='amount')data.amounts[b.session]=b.amount;if(b.action==='assist')data.assists[b.key].currentValue=b.value;if(b.action==='weather')data.weather[b.session][b.node][b.key].currentValue+=b.steps;}
    const result=path==='/api/state'?native:path==='/api/session/state'?{state:{settingMode:'SETTING_GRANDPRIX',gameState:'GSTATE_SETUP',navigationState:'NAV_MAIN_MENU'},loadingStatus:{loading:false},pid:123}:path==='/api/session/catalog'?catalog:data;
    return {ok:true,json:async()=>structuredClone(result)};
  }
  const code=session+'\n'+practice.match(/<script>([\s\S]*?)<\/script>/)[1]+'\n'+lab;
  const ui=new w.Function('fetch','setInterval','clearInterval',code+'\nreturn {setPage,reviewPlan,applyPendingPlan,planIntents,snapshotPlan,validatePlan,tyrePreset,renderLibrary,applyAppearance,applyIntent,needed,updateLabControls,loadSetup,modelKey,circuitName,layoutName,tyreOptions,updateTyreSettings,editPreset,renderPlans,renderCheckpoints,showLibrary(){labState='+JSON.stringify(native)+';renderLibrary();},stopPlan(){cancelPlan=true;},setNavReady(v){menuReady=v;updateLabControls();},getPrefs(){return labPreferences;}};')(fake,()=>0,()=>{});
  await new Promise(r=>setTimeout(r,20));await ui.loadSetup();
  let count=0;function check(c,m){if(!c)throw Error(m);count++;}
  check(!d.getElementById('homePanel').hidden,'Overview is default');check(!d.getElementById('practicePanel').hidden===false,'Other panels hidden');
  check(d.querySelectorAll('.vehicle-card').length===1,'Identical models grouped across seasons, unowned cars excluded');check(d.getElementById('carSelect').options.length===2,'Liveries remain selectable across seasons');check(d.getElementById('circuitSelect').options.length===1&&d.getElementById('trackSelect').options.length===2,'Circuit and layout use separate lists');check(d.querySelector('.brand-wordmark').textContent==='BMW'&&!d.querySelector('.car-pick svg'),'Brand overview replaces placeholder car');
  d.querySelector('[data-car]').click();await new Promise(r=>setTimeout(r,0));check(writes.length===0,'Selecting the active model keeps its livery');
  ui.setPage('practice');ui.renderCheckpoints(native);check(!d.querySelector('#destinationList button').disabled,'Destination buttons selectable on loaded track');d.querySelector('#destinationList button').click();check(d.getElementById('cp').value==='one','Practice destination selection uses shared checkpoint');check(!d.getElementById('practiceDock').hidden&&d.getElementById('setupDock').hidden,'Practice has its own action dock');
  ui.tyrePreset('warm');check(d.getElementById('tyreTemperatureFL').value==='70'&&d.getElementById('tyreTemperatureEnabledRR').checked,'Warm preset applies all wheels locally');check(writes.length===0,'Tyre choices do not mutate game');
  const range=d.getElementById('allCondition');range.value='45';range.dispatchEvent(new w.Event('input',{bubbles:true}));check(d.getElementById('tyreConditionFR').value==='45'&&d.getElementById('tyreConditionRL').value==='45','Bulk slider updates all wheels');
  ui.setPage('library');ui.showLibrary();check(d.querySelectorAll('.checkpoint-item').length===2,'Library includes all tracks');check(d.querySelector('[data-pick-checkpoint="other"]').disabled,'Other track cannot be selected for placement');
  const search=d.getElementById('librarySearch');search.value='turn';search.dispatchEvent(new w.Event('input',{bubbles:true}));check(d.querySelectorAll('.checkpoint-item').length===1,'Library search filters entries');
  ui.getPrefs().theme='daylight';ui.getPrefs().density='compact';ui.applyAppearance();check(d.body.dataset.theme==='daylight'&&d.body.dataset.density==='compact','Theme and density change');
  ui.setPage('home');ui.reviewPlan('Test',[{type:'setting',key:'SESSSET_Practice_Length',value:30},{type:'amount',session:'QUALIFY',value:1}]);check(writes.length===0,'Plan review performs no game writes');check(d.getElementById('planDialog').open,'Plan review is visible');
  await ui.applyPendingPlan();check(writes.length===2&&writes[0].steps===-30&&writes[1].amount===1,'Plan writes are relative/absolute as required');check(data.settings.SESSSET_Practice_Length.currentValue===30,'Plan confirms final setting');
  check(!ui.needed({type:'setting',key:'SESSSET_Practice_Length',value:30}),'Matching value creates no write');
  let invalid=false;try{ui.validatePlan({name:'bad',id:'bad',target:{}});}catch{invalid=true;}check(invalid,'Incomplete imports rejected');
  const target=ui.snapshotPlan();check(Object.keys(target.assists).length===0&&!ui.planIntents({...target,assists:{DRIVEAIDS_auto_wipers:0}}).some(i=>i.type==='assist'),'New and old presets preserve driving preferences');check(target.settings.SESSSET_Practice_Length===30&&target.weather.PRACTICE.START.WNV_TEMPERATURE===20,'Snapshot includes rules and weather values');
  const before=writes.length;ui.reviewPlan('Fail test',[{type:'setting',key:'SESSSET_Practice_Length',value:40},{type:'amount',session:'RACE',value:1},{type:'amount',session:'WARMUP',value:1}]);failAfter=before+1;await ui.applyPendingPlan();check(writes.length===before+2&&data.amounts.WARMUP===0,'Failure stops remaining writes without retry');check(d.getElementById('labToastText').textContent.includes('Stopped after 1'),'Partial success reported');
  d.getElementById('planDialog').close();failAfter=Infinity;const at=writes.length;ui.reviewPlan('Cancel test',[{type:'setting',key:'SESSSET_Practice_Length',value:45},{type:'amount',session:'WARMUP',value:1}]);stopAfterNext=true;await ui.applyPendingPlan();check(writes.length===at+1&&data.amounts.WARMUP===0,'Cancellation finishes one pending change and skips the remainder');
  ui.setNavReady(false);check(d.querySelector('[data-change]').disabled&&!d.querySelector('[data-template]').disabled,'Inactive menu locks mutations but permits plan browsing');
  ui.reviewPlan('Offline review',[{type:'setting',key:'SESSSET_Practice_Length',value:60}]);check(d.getElementById('planDialog').open&&d.getElementById('applyPlanButton').disabled,'Offline plans are reviewable without enabling apply');d.getElementById('planDialog').close();
  ui.setNavReady(true);ui.setPage('setup','weather');check(!!d.querySelector('.weather-chart'),'Weather chart is available');
  ui.renderCheckpoints({...native,busy:true});check(d.querySelector('#destinationList button').disabled,'Destinations disabled only during active operation');ui.renderCheckpoints(native);
  check(ui.modelKey({fullPathTree:'WEC 2026, LMP2, Oreca 07'})!==ui.modelKey({fullPathTree:'ELMS 2026, LMP2_ELMS, Oreca 07'}),'Distinct LMP2 regulations retain separate models');
  ui.setPage('setup','rules');check(!d.getElementById('sectionContent').textContent.includes('Driving assists')&&!d.querySelector('[data-assist]'),'Assist editing removed');
  ui.tyrePreset('reset');check(ui.tyreOptions().wheels.every(v=>v.temperatureCelsius===null),'Game defaults delegate warm and cold start to LMU');check(d.getElementById('allTemperatureValue').textContent==='Game default','Heat slider reset shows game default');check(d.getElementById('allTemperature').value==='0','Game default puts heat slider at zero');
  const heat=d.getElementById('allTemperature');check(heat.type==='range','All-wheel heat uses a slider');heat.value='82';heat.dispatchEvent(new w.Event('input',{bubbles:true}));check(ui.tyreOptions().wheels.every(v=>v.temperatureCelsius===82),'All-wheel heat updates four tyres');check(d.getElementById('allTemperatureValue').textContent==='82°C','Heat slider shows selected temperature');
  d.getElementById('tyreTemperatureFL').value='65';ui.updateTyreSettings();check(d.getElementById('allTemperatureValue').textContent==='Mixed','Individual heat changes show mixed bulk temperature');check(ui.tyreOptions().wheels[0].temperatureCelsius===65&&ui.tyreOptions().wheels[1].temperatureCelsius===82,'Individual heat independent of bulk input');
  heat.value='0';heat.dispatchEvent(new w.Event('input',{bubbles:true}));check(ui.tyreOptions().wheels.every(v=>v.temperatureCelsius===null)&&d.getElementById('allTemperatureValue').textContent==='Game default','Zero heat delegates all wheels to game default');
  check(!d.getElementById('commandButton')&&!d.body.textContent.includes('Keyboard shortcuts'),'Keyboard shortcut UI removed');
  ui.setPage('presets');d.getElementById('savePlanButton').click();d.getElementById('planName').value='Saved race';d.getElementById('confirmSavePlan').click();await new Promise(r=>setTimeout(r,20));
  check(ui.getPrefs().plans.length===1&&prefs.plans.length===1,'Preset save persists through API');const id=ui.getPrefs().plans[0].id;
  ui.editPreset(id);d.getElementById('planName').value='Renamed race';d.getElementById('confirmSavePlan').click();await new Promise(r=>setTimeout(r,20));check(ui.getPrefs().plans[0].name==='Renamed race'&&ui.getPrefs().plans[0].id===id,'Preset rename retains identity');
  data.settings.SESSSET_Practice_Length.currentValue=55;await ui.loadSetup();ui.editPreset(id,true);d.getElementById('confirmSavePlan').click();await new Promise(r=>setTimeout(r,20));check(ui.getPrefs().plans[0].target.settings.SESSSET_Practice_Length===55,'Preset update snapshots current session');
  ui.setPage('setup','rules');ui.getPrefs().density='comfortable';ui.applyAppearance();const roomy=d.querySelector('#sectionContent .setting-row').getBoundingClientRect().height;ui.getPrefs().density='compact';ui.applyAppearance();check(d.querySelector('#sectionContent .setting-row').getBoundingClientRect().height<roomy*.8,'Compact rows are materially smaller '+roomy+' -> '+d.querySelector('#sectionContent .setting-row').getBoundingClientRect().height);
  ui.setPage('settings');ui.getPrefs().theme='daylight';ui.applyAppearance();const active=d.querySelector('[data-theme].active'),style=w.getComputedStyle(active);function luminance(rgb){const v=rgb.match(/[0-9.]+/g).slice(0,3).map(n=>{const v=Number(n)/255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;});return v[0]*.2126+v[1]*.7152+v[2]*.0722;}const ink=luminance(style.color),bg=luminance(style.backgroundColor);check((Math.max(ink,bg)+.05)/(Math.min(ink,bg)+.05)>=4.5,'Light theme active controls have readable contrast');

  check(d.documentElement.scrollWidth===1280,'No desktop horizontal overflow');

run().catch(e=>document.getElementById('report').textContent='FAIL: '+e.stack);
</script></html>
